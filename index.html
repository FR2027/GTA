<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hsinchu City Stories - 新竹狂飆 3D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Impact', 'Segoe UI', Arial, sans-serif;
        }

        #webgl-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Loading 畫面 */
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, #1a1a2e 0%, #0f0f1a 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            transition: opacity 0.8s ease;
        }

        .loading-title {
            font-size: 56px;
            color: #ff0055;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.8), 3px 3px 0px #000;
            letter-spacing: 2px;
            text-align: center;
        }

        .loading-subtitle {
            font-size: 16px;
            color: #00ffcc;
            margin-top: 10px;
            font-family: sans-serif;
            text-align: center;
        }

        .progress-bar {
            width: 80%;
            max-width: 500px;
            height: 14px;
            background: #222;
            border: 2px solid #00ffcc;
            border-radius: 10px;
            margin-top: 30px;
            overflow: hidden;
        }

        #progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ffcc, #ff0055);
            transition: width 0.3s ease;
        }

        #loading-status {
            margin-top: 15px;
            font-size: 13px;
            color: #aaa;
            font-family: monospace;
        }

        /* HUD 介面 */
        #hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none;
        }

        #location-box {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-left: 6px solid #ff0055;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        #district-name {
            color: #fff;
            font-size: 22px;
            letter-spacing: 1px;
        }

        #street-name {
            color: #00ffcc;
            font-size: 14px;
            font-family: sans-serif;
            margin-top: 2px;
        }

        #stats-box {
            position: absolute;
            top: 25px;
            right: 25px;
            text-align: right;
        }

        #wanted-stars .star {
            font-size: 26px;
            color: #444;
            text-shadow: 0 0 5px #000;
        }

        #wanted-stars .star.active {
            color: #ffcc00;
            text-shadow: 0 0 10px #ffcc00;
        }

        #money {
            color: #2e7d32;
            font-size: 36px;
            text-shadow: 2px 2px 0px #000, 0 0 10px rgba(46, 125, 50, 0.8);
            margin-top: 5px;
        }

        #weapon-icon {
            color: #fff;
            font-size: 16px;
            font-family: sans-serif;
            background: rgba(0,0,0,0.6);
            padding: 6px 12px;
            display: inline-block;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #444;
        }

        #vehicle-hud {
            position: absolute;
            bottom: 30px;
            right: 30px;
            background: rgba(15, 15, 25, 0.85);
            border: 2px solid #00ffcc;
            padding: 15px 25px;
            border-radius: 12px;
            color: #fff;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            transition: opacity 0.3s;
        }

        #vehicle-hud.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #speed-display {
            font-size: 42px;
            color: #00ffcc;
        }

        #controls-hint {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 8px 20px;
            font-size: 13px;
            font-family: sans-serif;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            white-space: nowrap;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: #ff0055;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ff0055;
            transition: transform 0.1s;
        }

        #interaction-prompt {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 255, 204, 0.9);
            color: #000;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            font-family: sans-serif;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
            display: none;
        }
    </style>

    <!-- 載入 WebGL & 3D 物理核心庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>

    <!-- 載入動畫畫面 -->
    <div id="loading-screen">
        <div class="loading-title">HSINCHU CITY STORIES</div>
        <div class="loading-subtitle">新竹狂飆 3D - 實景開放世界引擎</div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="loading-status">正在載入 3D 核心與物理引擎...</div>
    </div>

    <!-- 3D 畫布容器 -->
    <div id="webgl-container"></div>

    <!-- HUD 遊戲 UI 圖層 -->
    <div id="hud-layer">
        <div id="location-box">
            <div id="district-name">新竹市東區 (Hsinchu East Dist.)</div>
            <div id="street-name">新竹火車站 / 光復路商圈</div>
        </div>

        <div id="stats-box">
            <div id="wanted-stars">
                <span class="star active">★</span><span class="star active">★</span><span class="star">★</span><span class="star">★</span><span class="star">★</span>
            </div>
            <div id="money">$ 000,250,000</div>
            <div id="weapon-icon">手槍 (9mm)</div>
        </div>

        <div id="vehicle-hud" class="hidden">
            <div id="speed-display"><span id="speed-value">0</span> <small style="font-size:16px;">KM/H</small></div>
            <div style="color: #aaa; font-family: sans-serif; font-size: 12px; margin-top: 4px;">HSINCHU GT SPORTS</div>
        </div>

        <div id="crosshair"></div>
        <div id="interaction-prompt">按下 [F] 鍵進入車輛</div>

        <div id="controls-hint">
            [W/A/S/D] 移動/駕駛 | [Shift] 跑步/甩尾 | [F] 上下車 | [Space] 跳躍/手煞車 | [滑鼠左鍵] 射擊
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 全域參數與組態 (CONFIG)
        // ==========================================
        const CONFIG = {
            MAP: {
                CENTER: { lat: 24.8015, lon: 120.9716 }, // 新竹火車站中心點
                SCALE: 111320,
                LOAD_RADIUS: 600 // 載入周邊 600 公尺 3D 建築
            },
            PLAYER: {
                HEIGHT: 1.8,
                WALK_SPEED: 7.0,
                RUN_SPEED: 14.0,
                JUMP_FORCE: 6.0,
                MASS: 70
            },
            VEHICLE: {
                MASS: 1200,
                ENGINE_FORCE: 2000,
                MAX_STEER: 0.5,
                BRAKE_FORCE: 60
            }
        };

        // ==========================================
        // 2. 遊戲主引擎類別 (Engine)
        // ==========================================
        class GameEngine {
            constructor() {
                this.container = document.getElementById('webgl-container');
                this.keys = {};
                this.mouse = { x: 0, y: 0 };

                // 狀態
                this.isDriving = false;
                this.bullets = [];

                this.initThree();
                this.initPhysics();
                this.initEntities();
                this.initEvents();

                // 載入實景地圖並啟動 Loop
                this.loadHsinchuMap().then(() => {
                    this.updateLoading(100, "系統準備就緒，進入新竹市！");
                    setTimeout(() => {
                        const loading = document.getElementById('loading-screen');
                        loading.style.opacity = '0';
                        setTimeout(() => loading.style.display = 'none', 800);
                    }, 500);
                    this.animate();
                });
            }

            // --- A. Three.js 場景與光影 ---
            initThree() {
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x11111d);
                this.scene.fog = new THREE.FogExp2(0x11111d, 0.0015);

                this.camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.container.appendChild(this.renderer.domElement);

                // 光源
                const ambient = new THREE.AmbientLight(0xffffff, 0.6);
                this.scene.add(ambient);

                this.sun = new THREE.DirectionalLight(0xfffaed, 1.2);
                this.sun.position.set(200, 400, 150);
                this.sun.castShadow = true;
                this.sun.shadow.mapSize.width = 2048;
                this.sun.shadow.mapSize.height = 2048;
                this.sun.shadow.camera.far = 1000;
                const d = 400;
                this.sun.shadow.camera.left = -d;
                this.sun.shadow.camera.right = d;
                this.sun.shadow.camera.top = d;
                this.sun.shadow.camera.bottom = -d;
                this.scene.add(this.sun);
            }

            // --- B. Cannon.js 物理世界 ---
            initPhysics() {
                this.world = new CANNON.World();
                this.world.gravity.set(0, -9.82, 0);
                this.world.broadphase = new CANNON.NaiveBroadphase();

                // 物理地面
                const groundShape = new CANNON.Plane();
                const groundBody = new CANNON.Body({ mass: 0 });
                groundBody.addShape(groundShape);
                groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
                this.world.addBody(groundBody);

                // 視覺地面 (新竹路面)
                const groundGeo = new THREE.PlaneGeometry(3000, 3000);
                const groundMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.8 });
                const groundMesh = new THREE.Mesh(groundGeo, groundMat);
                groundMesh.rotation.x = -Math.PI / 2;
                groundMesh.receiveShadow = true;
                this.scene.add(groundMesh);
            }

            // --- C. 生成玩家與車輛 ---
            initEntities() {
                // 1. 車輛物理與 Mesh
                const chassisShape = new CANNON.Box(new CANNON.Vec3(1.1, 0.5, 2.3));
                this.vehicleBody = new CANNON.Body({ mass: CONFIG.VEHICLE.MASS });
                this.vehicleBody.addShape(chassisShape);
                this.vehicleBody.position.set(0, 3, 0);
                this.world.addBody(this.vehicleBody);

                this.vehicle = new CANNON.RaycastVehicle({ chassisBody: this.vehicleBody });

                const wheelOpt = {
                    radius: 0.4,
                    directionLocal: new CANNON.Vec3(0, -1, 0),
                    suspensionStiffness: 30,
                    suspensionRestLength: 0.3,
                    frictionSlip: 4,
                    dampingRelaxation: 2.3,
                    dampingCompression: 4.4,
                    maxSuspensionForce: 100000,
                    rollInfluence: 0.01,
                    axleLocal: new CANNON.Vec3(-1, 0, 0),
                    chassisConnectionPointLocal: new CANNON.Vec3(1, 1, 0),
                    maxSuspensionTravel: 0.3,
                    customSlidingRotationalSpeed: -30,
                    useCustomSlidingRotationalSpeed: true
                };

                const wheels = [
                    new CANNON.Vec3(1.0, -0.3, 1.3),
                    new CANNON.Vec3(-1.0, -0.3, 1.3),
                    new CANNON.Vec3(1.0, -0.3, -1.3),
                    new CANNON.Vec3(-1.0, -0.3, -1.3)
                ];

                wheels.forEach(pos => {
                    wheelOpt.chassisConnectionPointLocal.copy(pos);
                    this.vehicle.addWheel(wheelOpt);
                });
                this.vehicle.addToWorld(this.world);

                // 車輛 Mesh
                this.carGroup = new THREE.Group();
                const bodyGeo = new THREE.BoxGeometry(2.2, 0.9, 4.6);
                const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff0055, metalness: 0.7, roughness: 0.2 });
                const carMesh = new THREE.Mesh(bodyGeo, bodyMat);
                carMesh.castShadow = true;
                this.carGroup.add(carMesh);

                const glassGeo = new THREE.BoxGeometry(1.8, 0.6, 2.0);
                const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
                const glass = new THREE.Mesh(glassGeo, glassMat);
                glass.position.set(0, 0.6, -0.2);
                this.carGroup.add(glass);

                this.scene.add(this.carGroup);

                // 輪胎 Meshes
                this.wheelMeshes = [];
                const wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
                wGeo.rotateZ(Math.PI / 2);
                const wMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
                for (let i = 0; i < 4; i++) {
                    const wMesh = new THREE.Mesh(wGeo, wMat);
                    wMesh.castShadow = true;
                    this.scene.add(wMesh);
                    this.wheelMeshes.push(wMesh);
                }

                // 2. 玩家物理與 Mesh
                const playerShape = new CANNON.Cylinder(0.4, 0.4, CONFIG.PLAYER.HEIGHT, 8);
                this.playerBody = new CANNON.Body({ mass: CONFIG.PLAYER.MASS });
                this.playerBody.addShape(playerShape);
                this.playerBody.position.set(5, 2, 5);
                this.playerBody.fixedRotation = true;
                this.playerBody.updateMassProperties();
                this.world.addBody(this.playerBody);

                this.playerMesh = new THREE.Group();
                const headGeo = new THREE.SphereGeometry(0.25, 16, 16);
                const headMat = new THREE.MeshStandardMaterial({ color: 0xffcc99 });
                const head = new THREE.Mesh(headGeo, headMat);
                head.position.y = 0.7;

                const bodyMeshGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.0, 16);
                const bodyMeshMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc });
                const pBody = new THREE.Mesh(bodyMeshGeo, bodyMeshMat);

                this.playerMesh.add(head, pBody);
                this.playerMesh.castShadow = true;
                this.scene.add(this.playerMesh);
            }

            // --- D. 解析與下載 OpenStreetMap 新竹實景地圖 ---
            async loadHsinchuMap() {
                this.updateLoading(30, "向 Overpass API 請求新竹縣市真實圖資...");
                const center = CONFIG.MAP.CENTER;
                const radius = CONFIG.MAP.LOAD_RADIUS;

                const query = `
                    [out:json];
                    (
                      way["building"](around:${radius},${center.lat},${center.lon});
                    );
                    out body;
                    >;
                    out skel qt;
                `;
                const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

                try {
                    const res = await fetch(url);
                    const data = await res.json();
                    this.updateLoading(70, "渲染新竹 3D 建築與物理碰撞層...");
                    this.renderOSMBuildings(data);
                } catch (e) {
                    console.error("OSM 地圖數據讀取失敗，使用基本環境:", e);
                }
            }

            renderOSMBuildings(osmData) {
                const nodes = {};
                const center = CONFIG.MAP.CENTER;

                osmData.elements.forEach(el => {
                    if (el.type === 'node') {
                        const x = (el.lon - center.lon) * CONFIG.MAP.SCALE * Math.cos(center.lat * Math.PI / 180);
                        const z = -(el.lat - center.lat) * CONFIG.MAP.SCALE;
                        nodes[el.id] = new THREE.Vector3(x, 0, z);
                    }
                });

                const bMat = new THREE.MeshStandardMaterial({ color: 0x3d4855, roughness: 0.6 });

                osmData.elements.forEach(el => {
                    if (el.type === 'way' && el.tags && el.tags.building && el.nodes) {
                        const points = el.nodes.map(id => nodes[id]).filter(p => p !== undefined);
                        if (points.length < 3) return;

                        const shape = new THREE.Shape();
                        shape.moveTo(points[0].x, points[0].z);
                        for (let i = 1; i < points.length; i++) {
                            shape.lineTo(points[i].x, points[i].z);
                        }

                        const levels = el.tags['building:levels'] ? parseInt(el.tags['building:levels']) : Math.floor(Math.random() * 5) + 3;
                        const height = levels * 3.5;

                        const extrudeSettings = { depth: height, bevelEnabled: false };
                        const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                        const mesh = new THREE.Mesh(geometry, bMat);
                        mesh.rotation.x = Math.PI / 2;
                        mesh.position.y = height;
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;

                        this.scene.add(mesh);

                        // 簡化建築物理碰撞
                        const bbox = new THREE.Box3().setFromObject(mesh);
                        const size = new THREE.Vector3();
                        bbox.getSize(size);
                        const bCenter = new THREE.Vector3();
                        bbox.getCenter(bCenter);

                        if (size.x > 0 && size.z > 0) {
                            const bShape = new CANNON.Box(new CANNON.Vec3(size.x / 2, height / 2, size.z / 2));
                            const bBody = new CANNON.Body({ mass: 0 });
                            bBody.addShape(bShape);
                            bBody.position.set(bCenter.x, height / 2, bCenter.z);
                            this.world.addBody(bBody);
                        }
                    }
                });
            }

            // --- E. 輸入監聽與射擊事件 ---
            initEvents() {
                window.addEventListener('keydown', (e) => {
                    const key = e.key.toLowerCase();
                    this.keys[key] = true;

                    // 上下車
                    if (key === 'f') this.toggleVehicle();
                });

                window.addEventListener('keyup', (e) => this.keys[e.key.toLowerCase()] = false);

                window.addEventListener('mousedown', (e) => {
                    if (e.button === 0 && !this.isDriving) this.shoot();
                });

                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            toggleVehicle() {
                const dist = this.playerBody.position.distanceTo(this.vehicleBody.position);

                if (!this.isDriving && dist < 5.0) {
                    this.isDriving = true;
                    document.getElementById('vehicle-hud').classList.remove('hidden');
                } else if (this.isDriving) {
                    this.isDriving = false;
                    this.playerBody.position.set(
                        this.vehicleBody.position.x + 2.5,
                        this.vehicleBody.position.y + 1.0,
                        this.vehicleBody.position.z
                    );
                    document.getElementById('vehicle-hud').classList.add('hidden');
                }
            }

            shoot() {
                const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
                const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);

                bulletMesh.position.copy(this.playerMesh.position);
                bulletMesh.position.y += 0.5;

                // 發射方向
                const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(this.playerMesh.quaternion);
                this.scene.add(bulletMesh);

                this.bullets.push({
                    mesh: bulletMesh,
                    dir: dir,
                    life: 60
                });
            }

            updateLoading(percent, text) {
                document.getElementById('progress-fill').style.width = percent + '%';
                document.getElementById('loading-status').innerText = text;
            }

            // --- F. 遊戲 Loop 與主邏輯更新 ---
            animate() {
                requestAnimationFrame(() => this.animate());

                // 物理世界更新
                this.world.step(1 / 60);

                // 1. 車輛或玩家更新
                if (this.isDriving) {
                    // 車輛操控
                    const force = CONFIG.VEHICLE.ENGINE_FORCE;
                    const steer = CONFIG.VEHICLE.MAX_STEER;

                    if (this.keys['w']) {
                        this.vehicle.applyEngineForce(-force, 2);
                        this.vehicle.applyEngineForce(-force, 3);
                    } else if (this.keys['s']) {
                        this.vehicle.applyEngineForce(force, 2);
                        this.vehicle.applyEngineForce(force, 3);
                    } else {
                        this.vehicle.applyEngineForce(0, 2);
                        this.vehicle.applyEngineForce(0, 3);
                    }

                    if (this.keys['a']) {
                        this.vehicle.setSteeringValue(steer, 0);
                        this.vehicle.setSteeringValue(steer, 1);
                    } else if (this.keys['d']) {
                        this.vehicle.setSteeringValue(-steer, 0);
                        this.vehicle.setSteeringValue(-steer, 1);
                    } else {
                        this.vehicle.setSteeringValue(0, 0);
                        this.vehicle.setSteeringValue(0, 1);
                    }

                    if (this.keys[' ']) {
                        this.vehicle.setBrake(CONFIG.VEHICLE.BRAKE_FORCE, 0);
                        this.vehicle.setBrake(CONFIG.VEHICLE.BRAKE_FORCE, 1);
                        this.vehicle.setBrake(CONFIG.VEHICLE.BRAKE_FORCE, 2);
                        this.vehicle.setBrake(CONFIG.VEHICLE.BRAKE_FORCE, 3);
                    } else {
                        this.vehicle.setBrake(0, 0);
                        this.vehicle.setBrake(0, 1);
                        this.vehicle.setBrake(0, 2);
                        this.vehicle.setBrake(0, 3);
                    }

                    // 攝影機追蹤車輛
                    const carPos = this.carGroup.position;
                    const offset = new THREE.Vector3(0, 5, -10).applyMatrix4(this.carGroup.matrixWorld);
                    this.camera.position.lerp(offset, 0.1);
                    this.camera.lookAt(carPos.x, carPos.y + 1.2, carPos.z);

                    // 車速 HUD
                    const speed = Math.round(this.vehicleBody.velocity.length() * 3.6);
                    document.getElementById('speed-value').innerText = speed;

                    document.getElementById('interaction-prompt').style.display = 'none';
                } else {
                    // 玩家步行操控
                    let mx = 0, mz = 0;
                    if (this.keys['w']) mz -= 1;
                    if (this.keys['s']) mz += 1;
                    if (this.keys['a']) mx -= 1;
                    if (this.keys['d']) mx += 1;

                    const speed = this.keys['shift'] ? CONFIG.PLAYER.RUN_SPEED : CONFIG.PLAYER.WALK_SPEED;

                    if (mx !== 0 || mz !== 0) {
                        const moveVec = new THREE.Vector3(mx, 0, mz).normalize();
                        this.playerBody.velocity.x = moveVec.x * speed;
                        this.playerBody.velocity.z = moveVec.z * speed;

                        const angle = Math.atan2(moveVec.x, moveVec.z);
                        this.playerMesh.rotation.y = angle;
                    } else {
                        this.playerBody.velocity.x = 0;
                        this.playerBody.velocity.z = 0;
                    }

                    if (this.keys[' '] && Math.abs(this.playerBody.velocity.y) < 0.05) {
                        this.playerBody.velocity.y = CONFIG.PLAYER.JUMP_FORCE;
                    }

                    // 攝影機追蹤玩家
                    const pPos = this.playerMesh.position;
                    this.camera.position.set(pPos.x, pPos.y + 4, pPos.z - 7);
                    this.camera.lookAt(pPos.x, pPos.y + 1.0, pPos.z);

                    // 提示靠近車輛
                    const dist = this.playerBody.position.distanceTo(this.vehicleBody.position);
                    document.getElementById('interaction-prompt').style.display = (dist < 5.0) ? 'block' : 'none';
                }

                // 2. 物理物件 Mesh 位置同步
                this.carGroup.position.copy(this.vehicleBody.position);
                this.carGroup.quaternion.copy(this.vehicleBody.quaternion);

                for (let i = 0; i < this.vehicle.wheelInfos.length; i++) {
                    this.vehicle.updateWheelTransform(i);
                    const t = this.vehicle.wheelInfos[i].worldTransform;
                    this.wheelMeshes[i].position.copy(t.position);
                    this.wheelMeshes[i].quaternion.copy(t.quaternion);
                }

                if (!this.isDriving) {
                    this.playerMesh.position.copy(this.playerBody.position);
                    this.playerMesh.visible = true;
                } else {
                    this.playerMesh.visible = false;
                }

                // 3. 子彈物理推進
                for (let i = this.bullets.length - 1; i >= 0; i--) {
                    const b = this.bullets[i];
                    b.mesh.position.addScaledVector(b.dir, 1.5);
                    b.life--;
                    if (b.life <= 0) {
                        this.scene.remove(b.mesh);
                        this.bullets.splice(i, 1);
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }
        }

        // 啟動專案
        window.onload = () => new GameEngine();
    </script>
</body>
</html>
