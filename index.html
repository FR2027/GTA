<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Hsinchu GTA v0.1 — Playable Open World</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- 解決瀏覽器無法直接 import 'three' 模組的問題 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="loading">
    <div class="loading-card">
      <div class="logo">HSINCHU <span>GTA</span></div>
      <div class="version">v0.1 — PLAYABLE OPEN WORLD</div>
      <div class="progress"><i id="progress"></i></div>
      <div id="loadingText">Initializing world...</div>
    </div>
  </div>

  <div id="hud">
    <div class="topbar">
      <div class="location" id="location">東門城</div>
      <div class="coords" id="coords">24.803950, 120.971500</div>
    </div>

    <div class="speedometer">
      <div class="speed" id="speed">0</div>
      <div class="unit">KM/H</div>
      <div class="rpm-wrap"><div class="rpm-label">RPM</div><div class="rpm"><i id="rpm"></i></div></div>
      <div class="heading" id="heading">N 000°</div>
    </div>

    <div class="minimap">
      <canvas id="minimap" width="220" height="220"></canvas>
      <div class="player-dot"></div>
      <div class="map-label" id="mapLabel">新竹市</div>
    </div>

    <div class="help">
      <b>WASD</b> / 方向鍵 駕駛　<b>SPACE</b> 手煞車　<b>R</b> 重置車輛　<b>V</b> 鏡頭
    </div>

    <div id="banner" class="banner"></div>
    <div id="mobileControls" class="mobile-controls">
      <button data-key="w">▲</button>
      <div><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div>
      <button data-key=" ">HANDBRAKE</button>
    </div>
  </div>

  <!-- 除錯版載入邏輯 -->
  <script type="module">
    window.addEventListener('error', (e) => {
      const el = document.getElementById('loadingText');
      if (el) el.innerHTML = `<span style="color:#ff5555;font-weight:bold;">ERROR: ${e.message}</span>`;
    });

    window.addEventListener('unhandledrejection', (e) => {
      const el = document.getElementById('loadingText');
      if (el) el.innerHTML = `<span style="color:#ff5555;font-weight:bold;">REJECTION: ${e.reason?.message || e.reason}</span>`;
    });

    try {
      await import('./src/main.js');
    } catch (err) {
      const el = document.getElementById('loadingText');
      if (el) el.innerHTML = `<span style="color:#ff5555;font-weight:bold;">LOAD FAILED: ${err.message || err}</span>`;
    }
  </script>
    <script type="module">
    const text = document.getElementById("loadingText");
    const show = (msg) => { if(text) text.innerHTML = `<span style="color:#ff5555;font-weight:bold;">${msg}</span>`; };

    async function check() {
      try {
        show("測試 Config.js..."); await import("./src/core/Config.js");
        show("測試 Input.js..."); await import("./src/input/Input.js");
        show("測試 HUD.js..."); await import("./src/ui/HUD.js");
        show("測試 EngineAudio.js..."); await import("./src/audio/EngineAudio.js");
        show("測試 Vehicle.js..."); await import("./src/vehicle/Vehicle.js");
        show("測試 World.js..."); await import("./src/world/World.js");
        show("測試 Game.js..."); await import("./src/core/Game.js");
        show("測試 main.js..."); await import("./src/main.js");
      } catch (err) {
        show(`載入失敗的檔案：${err.message || err}`);
      }
    }
    check();
  </script>

</body>
</html>
