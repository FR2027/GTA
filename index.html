<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hsinchu GTA - 新竹狂飆 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #webgl-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #hud {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #00ffcc;
            padding: 15px 25px;
            border-radius: 10px;
            border: 2px solid #00ffcc;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        #location-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            font-size: 18px;
            border-left: 5px solid #ff0055;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
        #loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top: 5px solid #00ffcc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <!-- Three.js 3D 渲染庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Cannon.js 3D 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
</head>
<body>
    <div id="loading-screen">
        <div class="spinner"></div>
        <h2 style="margin-top: 20px;">正在讀取新竹縣市真實地圖數據 (Overpass API)...</h2>
        <p>涵蓋新竹火車站、竹北、光復路與巨城商圈</p>
    </div>

    <div id="webgl-container"></div>

    <div id="ui-layer">
        <div id="location-tag">LOCATION: 新竹市東區 (Hsinchu East Dist.)</div>
        <div id="hud">
            <span id="speed">0</span> KM/H
        </div>
        <div id="crosshair"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
