<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Hsinchu GTA v0.1 — Playable Open World</title>
  <link rel="stylesheet" href="./style.css" />

  <!-- 解決瀏覽器無法直接 import 'three' 模組的問題 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="loading">
    <div class="loading-card">
      <div class="logo">HSINCHU <span>GTA</span></div>
      <div class="version">v0.1 — PLAYABLE OPEN WORLD</div>
      <div class="progress"><i id="progress"></i></div>
      <div id="loadingText">Initializing world...</div>
    </div>
  </div>

  <div id="hud">
    <div class="topbar">
      <div class="location" id="location">東門城</div>
      <div class="coords" id="coords">24.803950, 120.971500</div>
    </div>

    <div class="speedometer">
      <div class="speed" id="speed">0</div>
      <div class="unit">KM/H</div>
      <div class="rpm-wrap"><div class="rpm-label">RPM</div><div class="rpm"><i id="rpm"></i></div></div>
      <div class="heading" id="heading">N 000°</div>
    </div>

    <div class="minimap">
      <canvas id="minimap" width="220" height="220"></canvas>
      <div class="player-dot"></div>
      <div class="map-label" id="mapLabel">新竹市</div>
    </div>

    <div class="help">
      <b>WASD</b> / 方向鍵 駕駛　<b>SPACE</b> 手煞車　<b>R</b> 重置車輛　<b>V</b> 鏡頭
    </div>

    <div id="banner" class="banner"></div>
    <div id="mobileControls" class="mobile-controls">
      <button data-key="w">▲</button>
      <div><button data-key="a">◀</button><button data-key="s">▼</button><button data-key="d">▶</button></div>
      <button data-key=" ">HANDBRAKE</button>
    </div>
  </div>

  <!-- 整合版除錯與單元測試腳本 -->
  <script type="module">
    const logEl = document.getElementById('loadingText');
    
    const showError = (type, msg) => {
      if (logEl) {
        logEl.innerHTML = `<span style="color:#ff5555;font-weight:bold;word-break:break-all;">[${type}] ${msg}</span>`;
      }
    };

    // 全局未捕獲例外攔截
    window.addEventListener('error', (e) => showError('全局語法錯誤', e.message));
    window.addEventListener('unhandledrejection', (e) => showError('異步拒絕', e.reason?.message || e.reason));

    async function debugAndLaunch() {
      try {
        showError('診斷中', '1/8 測試 Config.js...');
        await import('./src/core/Config.js');

        showError('診斷中', '2/8 測試 Input.js...');
        await import('./src/input/Input.js');

        showError('診斷中', '3/8 測試 HUD.js...');
        await import('./src/ui/HUD.js');

        showError('診斷中', '4/8 測試 EngineAudio.js...');
        await import('./src/audio/EngineAudio.js');

        showError('診斷中', '5/8 測試 Vehicle.js...');
        await import('./src/vehicle/Vehicle.js');

        showError('診斷中', '6/8 測試 World.js...');
        await import('./src/world/World.js');

        showError('診斷中', '7/8 測試 Game.js...');
        await import('./src/core/Game.js');

        showError('診斷中', '8/8 測試 main.js...');
        await import('./src/main.js');

        // 若無任何錯誤，清空除錯文字恢復正常顯示
        if (logEl) logEl.innerHTML = '載入完成，準備進入遊戲...';
      } catch (err) {
        showError('模組載入失敗', `${err.name || 'Error'}: ${err.message || err}`);
      }
    }

    debugAndLaunch();
  </script>
</body>
</html>
