<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新竹 GTA 3D 實景完整版 - Hsinchu Real World Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #050811; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI 介面 */
        #ui-overlay {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(10, 15, 29, 0.85); backdrop-filter: blur(12px);
            padding: 20px; border-radius: 12px; border: 1px solid rgba(0, 255, 204, 0.3);
            width: 320px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 18px; color: #00ffcc; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .badge { background: #00ffcc; color: #000; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
        p { font-size: 13px; color: #ccc; margin-bottom: 6px; line-height: 1.4; }
        
        .controls-panel {
            margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.1);
            display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px;
        }
        .key { background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; color: #fff; font-weight: bold; }
        
        /* 傳送按鈕選單 */
        .teleport-menu { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
        .tp-btn {
            background: rgba(0, 255, 204, 0.1); border: 1px solid #00ffcc; color: #00ffcc;
            padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px; text-align: left;
            transition: all 0.2s;
        }
        .tp-btn:hover { background: #00ffcc; color: #000; font-weight: bold; }

        /* 儀表板與狀態 */
        #hud {
            position: absolute; bottom: 20px; right: 20px; z-index: 10;
            display: flex; flex-direction: column; align-items: flex-end; gap: 10px;
        }
        #speedometer {
            font-size: 48px; font-weight: 900; color: #fff; text-shadow: 0 0 20px rgba(0,255,204,0.6);
            font-family: 'Impact', sans-serif;
        }
        #speedometer span { font-size: 16px; color: #00ffcc; margin-left: 4px; }
        #mode-indicator {
            background: rgba(0,0,0,0.8); padding: 6px 16px; border-radius: 20px;
            font-size: 14px; border: 1px solid #00ffcc; color: #00ffcc;
        }

        #loading {
            position: absolute; inset: 0; background: #050811; z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px;
        }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(0,255,204,0.2); border-top-color: #00ffcc; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <!-- Import Three.js, Cannon-es & 3D Tiles Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-story-controls@1.0.0/dist/three-story-controls.usr.js"></script>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div style="color: #00ffcc; font-size: 18px; font-weight: bold;">正在載入新竹縣市 3D 實景地圖...</div>
        <div style="color: #888; font-size: 12px;">載入廣域地形與建築瓦片中</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-overlay">
        <h1>新竹 GTA 3D <span class="badge">完整版</span></h1>
        <p>涵蓋新竹市區、竹北、竹科與新竹縣實景。</p>
        
        <div class="controls-panel">
            <div><span class="key">WASD</span> 移動/開車</div>
            <div><span class="key">F</span> 上/下車</div>
            <div><span class="key">Space</span> 手煞車/跳躍</div>
            <div><span class="key">R</span> 車輛重置</div>
            <div><span class="key">Shift</span> 加速衝刺</div>
            <div><span class="key">滑鼠</span> 轉動視角</div>
        </div>

        <div class="teleport-menu">
            <p style="margin-top:8px; font-weight:bold; color:#fff;">📍 新竹縣市快速傳送點：</p>
            <button class="tp-btn" onclick="teleportTo('station')">1. 新竹火車站 / 東門城圓環</button>
            <button class="tp-btn" onclick="teleportTo('zhubei')">2. 竹北高鐵特區</button>
            <button class="tp-btn" onclick="teleportTo('hsp')">3. 新竹科學園區 (竹科)</button>
        </div>
    </div>

    <div id="hud">
        <div id="mode-indicator">駕駛模式 (In Car)</div>
        <div id="speedometer">0 <span>KM/H</span></div>
    </div>

    <script>
        // --- 1. 新竹地理座標與投影對映 (Hsinchu Geolocation Mapping) ---
        // 以新竹市中心 (24.8038, 120.9714) 為原點 (0, 0, 0)
        const HSINCHU_LOCATIONS = {
            station: { lat: 24.8038, lon: 120.9714, name: "新竹火車站/東門城" },
            zhubei: { lat: 24.8086, lon: 121.0404, name: "竹北高鐵特區" },
            hsp: { lat: 24.7820, lon: 121.0120, name: "新竹科學園區" }
        };

        const CENTER_LAT = HSINCHU_LOCATIONS.station.lat;
        const CENTER_LON = HSINCHU_LOCATIONS.station.lon;
        const METERS_PER_DEG_LAT = 111000;
        const METERS_PER_DEG_LON = 111000 * Math.cos(CENTER_LAT * Math.PI / 180);

        function geoToWorld(lat, lon) {
            const x = (lon - CENTER_LON) * METERS_PER_DEG_LON;
            const z = -(lat - CENTER_LAT) * METERS_PER_DEG_LAT;
            return { x, z };
        }

        // --- 2. 系統初始化 (Three.js & Cannon.js) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1d);
        scene.fog = new THREE.FogExp2(0x0a0f1d, 0.0008);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 3000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // 物理世界設定
        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.SAPBroadphase(world);

        // 光照與環境
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(300, 500, 200);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.far = 2000;
        scene.add(sunLight);

        // 地面 Base Plane
        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
        world.addBody(groundBody);

        const groundMesh = new THREE.Mesh(
            new THREE.PlaneGeometry(10000, 10000),
            new THREE.MeshStandardMaterial({ color: 0x121826, roughness: 0.9 })
        );
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // --- 3. 實景地圖生成機制 (OSM & Procedural City Blocks) ---
        const chunkGroup = new THREE.Group();
        scene.add(chunkGroup);

        async function loadHsinchuMapData() {
            // 自動加載新竹核心範圍 OSM 實景
            const query = `
                [out:json];
                (
                  way["building"](24.770,120.950,24.820,121.050);
                  way["highway"](24.770,120.950,24.820,121.050);
                );
                out body;
                >;
                out skel qt;
            `;
            const url = 'https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query);

            try {
                const res = await fetch(url);
                const data = await res.json();
                buildMap(data);
            } catch(e) {
                console.warn("使用預設 Procedural 模型載入地圖");
                buildProceduralHsinchu();
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function buildMap(data) {
            const nodes = {};
            data.elements.forEach(el => { if (el.type === 'node') nodes[el.id] = { lat: el.lat, lon: el.lon }; });

            const bldgMat = new THREE.MeshStandardMaterial({ color: 0x2a354d, roughness: 0.4, metalness: 0.3 });
            const roadMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 2 });

            data.elements.forEach(el => {
                if (el.type === 'way') {
                    if (el.tags && el.tags.building) {
                        const shape = new THREE.Shape();
                        let hasPoints = false;
                        el.nodes.forEach((nid, idx) => {
                            if (nodes[nid]) {
                                const pt = geoToWorld(nodes[nid].lat, nodes[nid].lon);
                                if (idx === 0) shape.moveTo(pt.x, -pt.z);
                                else shape.lineTo(pt.x, -pt.z);
                                hasPoints = true;
                            }
                        });
                        if (hasPoints) {
                            const levels = el.tags['building:levels'] ? parseInt(el.tags['building:levels']) : Math.floor(Math.random() * 6) + 2;
                            const height = levels * 3.8;
                            const geom = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: false });
                            geom.rotateX(Math.PI / 2);

                            const mesh = new THREE.Mesh(geom, bldgMat);
                            mesh.castShadow = true;
                            mesh.receiveShadow = true;
                            chunkGroup.add(mesh);
                        }
                    }
                }
            });
        }

        function buildProceduralHsinchu() {
            // 防呆預備模式
            for (let i = -10; i < 10; i++) {
                for (let j = -10; j < 10; j++) {
                    const h = Math.random() * 40 + 10;
                    const mesh = new THREE.Mesh(
                        new THREE.BoxGeometry(20, h, 20),
                        new THREE.MeshStandardMaterial({ color: 0x2a354d })
                    );
                    mesh.position.set(i * 50, h / 2, j * 50);
                    chunkGroup.add(mesh);
                }
            }
        }

        // --- 4. 玩家人物與跑車系統 (Entities) ---
        let isDriving = true;

        // A. 跑車實體
        const carBody = new CANNON.Body({ mass: 1600 });
        carBody.addShape(new CANNON.Box(new CANNON.Vec3(1.1, 0.5, 2.2)));
        carBody.position.set(0, 3, 0);
        world.addBody(carBody);

        const vehicle = new CANNON.RaycastVehicle({
            chassisBody: carBody,
            indexForwardAxis: 2, indexRightAxis: 0, indexUpAxis: 1
        });

        const wOpt = {
            radius: 0.45, directionLocal: new CANNON.Vec3(0, -1, 0),
            suspensionStiffness: 35, suspensionRestLength: 0.35,
            frictionSlip: 1.6, dampingRelaxation: 2.5, dampingCompression: 4.5,
            maxSuspensionForce: 100000, rollInfluence: 0.01,
            axleLocal: new CANNON.Vec3(1, 0, 0), chassisConnectionPointLocal: new CANNON.Vec3(1, 0, 1),
            maxSuspensionTravel: 0.3, customSlidingRotationalSpeed: -30, useContextSlidingRotationalSpeed: true
        };

        wOpt.chassisConnectionPointLocal.set(1, -0.2, 1.3); vehicle.addWheel(wOpt);
        wOpt.chassisConnectionPointLocal.set(-1, -0.2, 1.3); vehicle.addWheel(wOpt);
        wOpt.chassisConnectionPointLocal.set(1, -0.2, -1.3); vehicle.addWheel(wOpt);
        wOpt.chassisConnectionPointLocal.set(-1, -0.2, -1.3); vehicle.addWheel(wOpt);
        vehicle.addToWorld(world);

        const carMesh = new THREE.Group();
        const bodyMesh = new THREE.Mesh(
            new THREE.BoxGeometry(2.2, 0.9, 4.4),
            new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.2, metalness: 0.8 })
        );
        bodyMesh.position.y = 0.3;
        bodyMesh.castShadow = true;
        carMesh.add(bodyMesh);
        scene.add(carMesh);

        // B. 徒步角色實體 (Player Pedestrian)
        const playerBody = new CANNON.Body({ mass: 70, shape: new CANNON.Cylinder(0.4, 0.4, 1.8, 8) });
        playerBody.position.set(5, 2, 5);
        playerBody.fixedRotation = true;
        world.addBody(playerBody);

        const playerMesh = new THREE.Mesh(
            new THREE.CylinderGeometry(0.4, 0.4, 1.8, 16),
            new THREE.MeshStandardMaterial({ color: 0xff0055 })
        );
        playerMesh.castShadow = true;
        scene.add(playerMesh);

        // --- 5. 控制邏輯與鍵盤事件 ---
        const keys = { w: false, a: false, s: false, d: false, space: false, shift: false };
        
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = true;
            if (k === 's') keys.s = true;
            if (k === 'a') keys.a = true;
            if (k === 'd') keys.d = true;
            if (e.code === 'Space') keys.space = true;
            if (e.shiftKey) keys.shift = true;

            // F 鍵：切換上/下車
            if (k === 'f') toggleDriveMode();

            // R 鍵：翻車重置
            if (k === 'r' && isDriving) {
                carBody.position.y += 2;
                carBody.quaternion.set(0, 0, 0, 1);
                carBody.velocity.set(0, 0, 0);
            }
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k === 'w') keys.w = false;
            if (k === 's') keys.s = false;
            if (k === 'a') keys.a = false;
            if (k === 'd') keys.d = false;
            if (e.code === 'Space') keys.space = false;
            if (!e.shiftKey) keys.shift = false;
        });

        function toggleDriveMode() {
            isDriving = !isDriving;
            const modeEl = document.getElementById('mode-indicator');
            if (isDriving) {
                modeEl.innerText = "駕駛模式 (In Car)";
                playerMesh.visible = false;
            } else {
                modeEl.innerText = "徒步模式 (On Foot)";
                playerMesh.visible = true;
                // 下車放置在車身旁邊
                playerBody.position.copy(carBody.position).add(new CANNON.Vec3(2.5, 1, 0));
                playerBody.velocity.set(0, 0, 0);
            }
        }

        // --- 6. 快速傳送 (Teleport) ---
        window.teleportTo = function(locationKey) {
            const loc = HSINCHU_LOCATIONS[locationKey];
            if (!loc) return;

            const pos = geoToWorld(loc.lat, loc.lon);
            carBody.position.set(pos.x, 5, pos.z);
            carBody.velocity.set(0, 0, 0);
            carBody.quaternion.set(0, 0, 0, 1);

            playerBody.position.set(pos.x + 3, 2, pos.z);
            playerBody.velocity.set(0, 0, 0);
        };

        // --- 7. 主渲染與物理更新迴圈 (Game Loop) ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            world.step(1 / 60, delta, 3);

            if (isDriving) {
                // 駕駛模式控制
                const engineForce = keys.shift ? 2600 : 1800;
                const maxSteer = 0.45;

                const force = (keys.w ? -engineForce : 0) + (keys.s ? engineForce : 0);
                const steer = (keys.a ? maxSteer : 0) + (keys.d ? -maxSteer : 0);

                vehicle.applyEngineForce(force, 2);
                vehicle.applyEngineForce(force, 3);
                vehicle.setSteeringValue(steer, 0);
                vehicle.setSteeringValue(steer, 1);

                const brake = keys.space ? 80 : 0;
                vehicle.setBrake(brake, 0); vehicle.setBrake(brake, 1);
                vehicle.setBrake(brake, 2); vehicle.setBrake(brake, 3);

                // 新竹風城動態強風干擾 (九降風側風效果)
                const currentSpeed = carBody.velocity.length();
                if (currentSpeed > 10) {
                    carBody.applyForce(new CANNON.Vec3(120, 0, 0), carBody.position);
                }

                // 更新車身位置
                carMesh.position.copy(carBody.position);
                carMesh.quaternion.copy(carBody.quaternion);

                // 第三人稱車輛鏡頭
                const camOffset = new THREE.Vector3(0, 5, 12).applyQuaternion(carMesh.quaternion);
                camera.position.copy(carMesh.position).add(camOffset);
                camera.lookAt(carMesh.position.x, carMesh.position.y + 1.2, carMesh.position.z);

                // 更新儀表板
                document.getElementById('speedometer').innerHTML = `${Math.round(currentSpeed * 3.6)} <span>KM/H</span>`;
            } else {
                // 徒步模式控制
                const moveSpeed = keys.shift ? 12 : 5;
                const moveVec = new THREE.Vector3(
                    (keys.d ? 1 : 0) - (keys.a ? 1 : 0),
                    0,
                    (keys.s ? 1 : 0) - (keys.w ? 1 : 0)
                ).normalize().multiplyScalar(moveSpeed);

                playerBody.velocity.x = moveVec.x;
                playerBody.velocity.z = moveVec.z;

                if (keys.space && Math.abs(playerBody.velocity.y) < 0.1) {
                    playerBody.velocity.y = 6; // 跳躍
                }

                playerMesh.position.copy(playerBody.position);

                // 徒步第三人稱鏡頭
                camera.position.set(playerMesh.position.x, playerMesh.position.y + 3, playerMesh.position.z + 8);
                camera.lookAt(playerMesh.position.x, playerMesh.position.y + 1, playerMesh.position.z);

                document.getElementById('speedometer').innerHTML = `0 <span>KM/H</span>`;
            }

            renderer.render(scene, camera);
        }

        loadHsinchuMapData();
        animate();

        // 視窗 resize 響應
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
